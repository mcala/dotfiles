# Portable config-editing sessions (tag-workstation). Jump straight to a
# config directory on any workstation. Host-only config shortcuts (e.g.
# aerospace) live in host-<name>/config/sesh/local.toml.

[[session]]
name = "All Config Files"
path = "~/.config"

[[session]]
name = "etc"
path = "/etc"

[[session]]
name = "Configure Tmux"
path = "~/.config/tmux"

[[session]]
name = "Configure Neovim"
path = "~/.config/nvim-lazy"

[[session]]
name = "Configure Zsh"
path = "~/.config/zsh"

[[session]]
name = "Configure Sesh"
path = "~/.config/sesh"

[[session]]
name = "Configure Ghostty"
path = "~/.config/ghostty"

[[session]]
name = "Configure Global Claude"
path = "~/.claude"
