colourful: true

filenames:
  tests: { icon: { glyph: 󰙨 } }
  data: { icon: { glyph: 󰆼 } }
  logs: { icon: { glyph } }
  CLAUDE.md: { icon: { glyph } }
  CHANGELOG.md: { icon: { glyph } }
  pyproject.toml: { filename: { foreground: White }, icon: { glyph: 🐍 } }
  ruff.toml: { icon: { glyph: ✨ } }
  ty.toml: { icon: { glyph: ✨ } }
  release.toml: { icon: { glyph: ✨ } }

# Melange Dark Palette (https://github.com/shiftwinting/melange)
# Background: #2A2622
# Foreground: #EDE6DE
# Black: #38332E
# Red: #B34D4D
# Green: #669966
# Yellow: #F7C96E
# Blue: #94A8D1
# Magenta: #AD85AD
# Cyan: #85ADAD
# White: #C9B39C
# Gray: #998066
# Bright Black: #544D45
# Bright Red: #F7856E
# Bright Green: #94D194
# Bright Yellow: #F7C96E
# Bright Blue: #94A8D1
# Bright Magenta: #D194BD
# Bright Cyan: #94D1D1
# Bright White: #EDE6DE
# Orange (accent): #E09952
#
filekinds:
  normal: { foreground: "#EDE6DE" }
  directory: { foreground: "#E09952" }
  symlink: { foreground: "#94D1D1" }
  pipe: { foreground: "#F7C96E" }
  block_device: { foreground: "#F7C96E" }
  char_device: { foreground: "#F7C96E" }
  socket: { foreground: "#D194BD" }
  special: { foreground: "#D194BD" }
